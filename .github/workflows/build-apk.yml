name: Build Android APK
# اجرای دستی: Actions ← Build Android APK ← Run workflow. خروجی در Artifacts (فایل app-debug.apk).
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js icon.svg icon-192.png icon-512.png css js www/
      - name: Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Bazi Lab" com.bazi.lab --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bazi-lab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
